# The Linux app's own checks: the unit tests on the two Pythons the app meets (3.11 on the
# runner, 3.13 on Mobian), the parity ledger, and the amd64 package built from the Bridge's
# container image and installed in a bare Debian 13 (no display: the app answers --version,
# the units parse). The arm64 package is built on the bench with the daemon built on a phone
# (build-deb.sh), and the end-to-end tests run on the phone (tools/e2e-run.sh): neither is a
# CI job.
stages: [test, package]

unit-3.11:
  stage: test
  image: python:3.11-slim
  tags: [multiarch]
  script:
    - python3 -m unittest discover tests
    - python3 tools/parity-check.py

unit-3.13:
  stage: test
  image: python:3.13-slim
  tags: [multiarch]
  script:
    - python3 -m unittest discover tests

package-amd64:
  stage: package
  image: docker:27
  tags: [multiarch]
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash coreutils dpkg python3 py3-pillow binutils git
  script:
    - BRIDGE_TAG=$(grep -o 'BRIDGE_TAG=[0-9a-f]*' build-deb.sh | head -1 | cut -d= -f2)
    - '[ -n "$BRIDGE_TAG" ] || BRIDGE_TAG=latest'
    - mkdir -p inputs && sh fetch-bridge.sh "$BRIDGE_TAG" inputs amd64
    - VERSION=$(python3 -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("app/meshsat/__init__.py").read()).group(1))')
    - sh build-deb.sh --arch amd64 --version "$VERSION" --inputs inputs
    - ls -la build/*.deb
  artifacts:
    paths: [build/*.deb]
    expire_in: 2 weeks

install-amd64:
  stage: package
  image: debian:trixie
  tags: [multiarch]
  needs: [package-amd64]
  script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ./build/meshsat_*_amd64.deb > install.log 2>&1 || { tail -40 install.log; exit 1; }
    - meshsat-app --version
    - PYTHONPATH=/usr/lib/meshsat/app python3 -c 'import meshsat.api, meshsat.model.words, meshsat.routes; print("modules import")'
    - /usr/bin/meshsat --version || true
    - systemd-analyze verify /lib/systemd/system/meshsat-bridge.service /lib/systemd/system/meshsat-hardware.service || true
    - dpkg -L meshsat | wc -l
